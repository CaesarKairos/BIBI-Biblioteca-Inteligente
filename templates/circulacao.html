{% extends 'shell.html' %}{% block content %}<div class='account-card profile-card shell-card'><p id='account-status' role='status'></p><section id="gestao-circulacao"><h2>Pedidos de renovação</h2><div id="renewal-list"></div><h2>Reservas físicas</h2><p>Exemplares separados ficam fora do estoque livre. A retirada deve ser registrada como empréstimo pelo cadastro do leitor.</p><div id="reservation-list"></div>
<h2>Perda, dano e reparo</h2><form id="occurrence-form"><label>Livro<select name="livro_id" id="occurrence-book"></select></label><label>Ocorrência<select name="tipo"><option value="observacao">Apenas observação de dano</option><option value="reparo">Retirar exemplar livre para reparo</option><option value="retorno_reparo">Retorno de reparo</option><option value="baixa">Baixa definitiva de exemplar livre</option><option value="perda">Perda</option></select></label><label>Quantidade<input type="number" name="quantidade" min="1" value="1" required></label><label>ID do empréstimo para perda ou observação (se aplicável)<input type="number" name="emprestimo_id" min="1"></label><label>Observação<textarea name="observacao" maxlength="2000" required></textarea></label><button class="btn-primary">Registrar ocorrência</button></form>
</section></div>{% endblock %}{% block scripts %}{{ super() }}<script src='/static/js/gestao.js'></script>{% endblock %}
