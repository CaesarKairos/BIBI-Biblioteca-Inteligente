<section id="bibi-chat" hidden aria-label="Converse com a BIBI">
  <header class="bibi-chat-header"><span class="bibi-avatar"><span class="bibi-cat-icon" aria-hidden="true"></span></span><div><span class="eyebrow">SUA COMPANHIA DE LEITURA</span><h3>Converse com a BIBI</h3></div><button type="button" id="bibi-clear" class="bibi-new" aria-label="Nova conversa" title="Nova conversa">＋</button></header>
  <div class="bibi-welcome"><p>Que história vamos descobrir?</p><span id="bibi-context">Um novo livro, uma personagem, uma ideia…</span></div>
  <div id="bibi-suggestions" aria-label="Ideias para começar"></div>
  <div id="bibi-messages" role="log" aria-label="Conversa com a BIBI" aria-live="polite" aria-relevant="additions text"></div>
  <p id="bibi-status" role="status" aria-live="polite"></p>
  <form id="bibi-chat-form" class="bibi-composer"><label class="visually-hidden" for="bibi-input">Sua mensagem</label><textarea id="bibi-input" name="mensagem" maxlength="2000" rows="2" required placeholder="Conte o que você quer ler…"></textarea><div class="bibi-compose-actions"><span>Vamos conversar sobre livros</span><button type="button" id="bibi-cancel" hidden>Parar resposta</button><button type="submit" id="bibi-send" aria-label="Enviar mensagem" title="Enviar mensagem">↑</button></div></form>
  <details class="bibi-privacy-note"><summary>Sobre esta conversa</summary><p id="bibi-privacy"></p></details>
</section>
