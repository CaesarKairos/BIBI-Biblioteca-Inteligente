{% extends 'shell.html' if conta else 'publico.html' %}
{% block content %}
<div class="{{ 'account-card shell-card' if conta else '' }}">
  <a href="{{ '/configuracoes' if conta else '/acesso' }}">Voltar</a>
  <h1>{{ textos.get('biblioteca_nome','BIBI') }}</h1>
  <h2 id="termos">Termos de Uso</h2>
  <p class="institution-text">{{ textos.get('termos_uso') }}</p>
  <h2 id="privacidade">Aviso de Privacidade</h2>
  <p class="institution-text">{{ textos.get('aviso_privacidade') }}</p>
</div>
{% endblock %}
